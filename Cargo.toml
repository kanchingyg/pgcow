[package]
name = "pgcow"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Instant local data-directory branches via OS copy-on-write, synced with git"
authors = ["Augusto Cerrutti <augustocerruttisatto@gmail.com>"]
repository = "https://github.com/kanchingyg/pgcow"
readme = "README.md"

[[bin]]
name = "pgcow"
path = "src/main.rs"

[lib]
name = "pgcow"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

